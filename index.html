<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Distance Tracker v2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #000; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .card { background: #111; width: 90%; max-width: 400px; padding: 40px 20px; border-radius: 40px; border: 2px solid #333; }
        .distance { font-size: 5.5rem; font-weight: 900; color: #00ff88; line-height: 1; }
        .unit { font-size: 1.2rem; color: #888; margin-bottom: 30px; letter-spacing: 2px; }
        .accuracy { font-size: 0.8rem; color: #ffcc00; margin-bottom: 20px; }
        button { width: 100%; padding: 20px; font-size: 1.3rem; font-weight: bold; border: none; border-radius: 20px; cursor: pointer; transition: 0.3s; }
        #startBtn { background: #00ff88; color: #000; }
        #stopBtn { background: #ff3333; color: white; display: none; }
        .info { margin-top: 15px; font-size: 0.8rem; color: #555; }
    </style>
</head>
<body>

<div class="card">
    <div id="accDisplay" class="accuracy">GPS በመፈለግ ላይ...</div>
    <div class="distance" id="kmDisplay">0.00</div>
    <div class="unit">ኪሎሜትር (KM)</div>
    
    <button id="startBtn" onclick="startTracking()">ጀምር (START)</button>
    <button id="stopBtn" onclick="stopTracking()">አቁም (STOP)</button>
    
    <div class="info">ለበለጠ ትክክለኛነት ክፍት ቦታ ይውጡ</div>
</div>

<script>
    let watchId = null;
    let totalDistance = 0;
    let lastCoords = null;
    let isFirstPoint = true;

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function startTracking() {
        if (!navigator.geolocation) return alert("GPS አይሰራም!");

        totalDistance = 0;
        lastCoords = null;
        isFirstPoint = true;
        document.getElementById('kmDisplay').innerText = "0.00";
        document.getElementById('startBtn').style.display = 'none';
                document.getElementById('stopBtn').style.display = 'block';

        watchId = navigator.geolocation.watchPosition(position => {
            const { latitude, longitude, accuracy } = position.coords;
            
            // የ GPS ጥራትን ማሳያ
            document.getElementById('accDisplay').innerText = "ጥራት: " + Math.round(accuracy) + " ሜትር";

            // ጥራቱ ከ 20 ሜትር በላይ ከሆነ ስህተት ስለሚበዛው አይቆጥርም
            if (accuracy > 20) return;

            if (isFirstPoint) {
                lastCoords = { latitude, longitude };
                isFirstPoint = false;
                return;
            }

            const dist = calculateDistance(lastCoords.latitude, lastCoords.longitude, latitude, longitude);

            // በሰከንድ ከ 0.002 KM (2 ሜትር) በላይ እና ከ 0.5 KM (500 ሜትር) በታች ከሆነ ብቻ ቁጠር
            // ይህ በድንገት የሚዘልለውን (0.74km ያለህን) ስህተት ያስቀረዋል
            if (dist > 0.002 && dist < 0.2) {
                totalDistance += dist;
                document.getElementById('kmDisplay').innerText = totalDistance.toFixed(2);
                lastCoords = { latitude, longitude };
            }
        }, err => {
            console.error(err);
        }, {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        });
    }

    function stopTracking() {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        document.getElementById('startBtn').style.display = 'block';
        document.getElementById('stopBtn').style.display = 'none';
        document.getElementById('accDisplay').innerText = "ተቋርጧል";
    }
</script>

</body>
</html>
